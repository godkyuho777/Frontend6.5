<!doctype html>
<html lang="ko">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tradelab — 암호화폐 시그널 트래커</title>
    <meta
      name="description"
      content="BBDX(RSI·BB·ADX) 멀티-패스 진입 시그널, 온체인 modifier, 백테스팅, 멀티 타임프레임 추세 분석을 한 화면에서 제공하는 암호화폐 시그널 트래커." />
    <meta name="theme-color" content="#0b0e14" />
    <!-- 파비콘 — 기존엔 없어 브라우저 기본(빈) 아이콘이 노출됐다. SVG 글리프 사용. -->
    <link rel="icon" type="image/svg+xml" href="/design-system/assets/tradelab-glyph-small.svg" />
    <!-- 링크 공유 미리보기 (Open Graph / Twitter Card) — 기존엔 없어 카카오톡·
         디스코드·트위터 등에 Tradelab 링크를 붙여도 미리보기가 비었다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tradelab" />
    <meta property="og:title" content="Tradelab — 암호화폐 시그널 트래커" />
    <meta
      property="og:description"
      content="BBDX(RSI·BB·ADX) 멀티-패스 진입 시그널 + 온체인 modifier + 백테스팅 + 멀티 타임프레임 추세 분석을 한 화면에서." />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="/design-system/assets/tradelab-logomark.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tradelab — 암호화폐 시그널 트래커" />
    <meta
      name="twitter:description"
      content="BBDX 시그널 · 온체인 modifier · 백테스팅 · 멀티 TF 추세 분석" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
