name: Frontend Test & Type Check

# P2-#8 (2026-05-23, AUDIT.md): push / PR 시 자동 검증.
#
# 정책:
#   - dev / main / feat/* 브랜치 push 시 자동 실행
#   - PR 에서 base 가 dev / main 일 때 실행
#   - 백엔드 의존성 (@tradelab/backend git URL) → npm 가 fetch 가능해야 함
#   - 단순 type check + build 위주 (frontend 는 unit test 가 적음)

on:
  push:
    branches: [dev, main, "feat/**"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        # @tradelab/backend 은 git URL 의존성 → public GitHub access 필요.
        # SKIP_PREPARE 는 백엔드의 prepare 훅 무한 루프 방지 (CLAUDE.md).
        run: SKIP_PREPARE=1 pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      # 현재 frontend 는 vitest 미설정 → test step 생략.
      # 추후 unit test 추가 시 여기에 `pnpm test --run` 활성화.

      - name: Build
        # Vite production build — 실제 Vercel 빌드와 동일 환경 검증
        env:
          NODE_ENV: production
        run: pnpm build
